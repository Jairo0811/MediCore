name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MediCore.slnx

      - name: Build
        run: dotnet build MediCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MediCore.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (React + QA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MediCore.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/MediCore.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility smoke tests
        run: npm run test:e2e
