name: Generate EF Baseline

on:
  push:
    branches:
      - feature/phases-7-10-production-readiness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MediCore.slnx
      - run: dotnet build MediCore.slnx --configuration Release --no-restore
      - run: dotnet tool restore
      - name: Generate baseline migration
        run: |
          if [ ! -d src/MediCore.Infrastructure/Persistence/Migrations ]; then
            dotnet ef migrations add InitialCreate \
              --project src/MediCore.Infrastructure/MediCore.Infrastructure.csproj \
              --startup-project src/MediCore.Api/MediCore.Api.csproj \
              --context MediCoreDbContext \
              --output-dir Persistence/Migrations \
              --configuration Release \
              --no-build
          fi
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MediCore.Infrastructure/Persistence/Migrations
          if ! git diff --cached --quiet; then
            git commit -m "chore: add EF Core initial migration"
            git push origin HEAD:feature/phases-7-10-production-readiness
          fi
