services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medicore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - medicore-sqlserver-data:/var/opt/mssql

volumes:
  medicore-sqlserver-data:
