services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medicore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - medicore-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-c"]
    command: >
      /opt/mssql-tools18/bin/sqlcmd
      -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
      -Q "IF DB_ID(N'MediCore') IS NULL CREATE DATABASE MediCore;"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/MediCore.Api/Dockerfile
    container_name: medicore-api
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MediCore;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      Database__InitializeOnStartup: "true"
      Auth__AllowBootstrapAdmin: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: MediCore
      Jwt__Audience: MediCore.Web
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "8080:8080"

  web:
    build:
      context: ./src/MediCore.Web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: medicore-web
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  medicore-sql-data:
